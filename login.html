<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Cliente | EngQuadros</title>
    <link rel="icon" type="image/png" href="public/favicon.png">
    
    <!-- Tipografia Corporativa -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { 
            --azul-profundo: #060b14; 
            --azul-marca: #0b1c35; 
            --azul-sutil: #2b5c92; 
            --branco: #ffffff;
            --sucesso: #10b981;
            --erro: #ef4444;
            --transicao: all 0.3s ease;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: var(--azul-profundo); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; color: var(--branco); padding: 20px; 
            overflow: hidden;
        }

        h1, h2, h3, button, .abas-auth button { font-family: 'Montserrat', sans-serif; }

        /* BACKGROUND INDUSTRIAL IGUAL AO SITE */
        .global-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1581092160562-40aa08e78837?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center;
            z-index: -5; opacity: 0.18; mix-blend-mode: luminosity;
        }

        .circuit-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: -4;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px; 
        }

        /* CONTAINER GLASSMORPHISM */
        .auth-container { 
            background: rgba(6, 11, 20, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 45px 40px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            border: 1px solid rgba(255, 255, 255, 0.1); border-top: 4px solid var(--azul-sutil); 
            width: 100%; max-width: 480px; position: relative; z-index: 10;
        }

        .logo { max-width: 160px; margin-bottom: 25px; display: block; margin-left: auto; margin-right: auto; }
        
        .abas-auth { display: flex; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .abas-auth button { 
            flex: 1; padding: 12px; background: transparent; color: rgba(255,255,255,0.5); 
            border: none; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; 
            transition: var(--transicao); font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .abas-auth button:hover { color: var(--branco); }
        .abas-auth button.ativo { color: var(--branco); border-bottom-color: var(--azul-sutil); }

        .input-group { margin-bottom: 18px; text-align: left; }
        .input-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: rgba(255,255,255,0.7); font-weight: 500; }
        .input-group input { 
            width: 100%; padding: 12px 15px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15); 
            background: rgba(255,255,255,0.03); color: var(--branco); font-size: 0.95rem; transition: var(--transicao);
        }
        .input-group input:focus { outline: none; border-color: var(--azul-sutil); background: rgba(255,255,255,0.08); box-shadow: 0 0 0 3px rgba(43, 92, 146, 0.2); }

        .linha-dupla { display: flex; gap: 15px; }
        .linha-dupla .input-group { flex: 1; }

        .btn-acao { 
            width: 100%; padding: 14px; background: var(--azul-marca); color: var(--branco); 
            border: none; border-radius: 6px; font-size: 1rem; font-weight: 700; 
            cursor: pointer; transition: var(--transicao); margin-top: 15px; letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-acao:hover { background: var(--azul-sutil); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(43, 92, 146, 0.3); }
        
        .btn-sucesso { background: var(--sucesso); border-color: var(--sucesso); }
        .btn-sucesso:hover { background: #0ea5e9; box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3); }

        .mensagem { font-size: 0.9rem; margin-top: 15px; display: none; text-align: center; font-weight: 600; padding: 10px; border-radius: 6px; }
        .msg-erro { background: rgba(239, 68, 68, 0.1); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.2); }
        .msg-ok { background: rgba(16, 185, 129, 0.1); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.2); }

        .voltar { display: block; margin-top: 30px; color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.9rem; transition: var(--transicao); text-align: center; font-weight: 500; }
        .voltar:hover { color: var(--branco); }
    </style>
</head>
<body>

    <div class="global-bg"></div>
    <div class="circuit-overlay"></div>

    <div class="auth-container">
        <img src="public/logo.png" alt="EngQuadros" class="logo">
        
        <div class="abas-auth">
            <button id="btnAbaLogin" class="ativo" onclick="alternarAba('login')">Área do Cliente</button>
            <button id="btnAbaCadastro" onclick="alternarAba('cadastro')">Novo Cadastro</button>
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <form id="formLogin">
            <div class="input-group">
                <label>CNPJ da Empresa</label>
                <input type="text" id="loginCnpj" placeholder="Somente números" required autocomplete="off">
            </div>
            <div class="input-group">
                <label>Chave de Acesso (Senha)</label>
                <input type="password" id="loginSenha" required>
            </div>
            <button type="submit" class="btn-acao"><i class="fa-solid fa-lock-open"></i> Acessar Portal</button>
            <div id="msgErroLogin" class="mensagem msg-erro"><i class="fa-solid fa-triangle-exclamation"></i> CNPJ ou Senha incorretos.</div>
        </form>

        <!-- FORMULÁRIO DE CADASTRO -->
        <form id="formCadastro" style="display: none;">
            <div class="input-group">
                <label>Razão Social da Empresa</label>
                <input type="text" id="cadRazao" required>
            </div>
            <div class="linha-dupla">
                <div class="input-group"><label>CNPJ (Somente Números)</label><input type="text" id="cadCnpj" required></div>
                <div class="input-group"><label>WhatsApp</label><input type="text" id="cadWhatsapp" required></div>
            </div>
            <div class="input-group">
                <label>Nome do Contato Responsável</label>
                <input type="text" id="cadNome" required>
            </div>
            <div class="input-group">
                <label>E-mail Corporativo</label>
                <input type="email" id="cadEmail" required>
            </div>
            <div class="input-group">
                <label>Crie uma Chave de Acesso (Senha)</label>
                <input type="password" id="cadSenha" required>
            </div>
            <button type="submit" class="btn-acao btn-sucesso"><i class="fa-solid fa-user-check"></i> Finalizar Cadastro</button>
            <div id="msgCadastro" class="mensagem"></div>
        </form>

        <a href="index.html" class="voltar"><i class="fa-solid fa-arrow-left"></i> Retornar ao site institucional</a>
    </div>

    <!-- SCRIPT ORIGINAL MANTIDO -->
    <script>
        const supabaseUrl = 'https://grqfsfvqfnybjckopwqy.supabase.co'; 
        const supabaseKey = 'sb_publishable_VEaH0YLuk_Wmf55CpZFOrg_Rv2L5qxE';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        function alternarAba(aba) {
            document.getElementById('btnAbaLogin').className = aba === 'login' ? 'ativo' : '';
            document.getElementById('btnAbaCadastro').className = aba === 'cadastro' ? 'ativo' : '';
            
            document.getElementById('formLogin').style.display = aba === 'login' ? 'block' : 'none';
            document.getElementById('formCadastro').style.display = aba === 'cadastro' ? 'block' : 'none';
        }

        // LÓGICA DE LOGIN
        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();
            const cnpjInput = document.getElementById('loginCnpj').value.trim();
            const chaveInput = document.getElementById('loginSenha').value.trim();
            const msgErro = document.getElementById('msgErroLogin');
            const btn = document.querySelector('#formLogin .btn-acao');
            
            msgErro.style.display = 'none';
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Autenticando...';
            btn.disabled = true;

            const { data, error } = await supabaseClient.from('clientes')
                .select('*').eq('cnpj', cnpjInput).eq('chave_mestre', chaveInput);

            if (error || data.length === 0) {
                msgErro.style.display = 'block';
                btn.innerHTML = '<i class="fa-solid fa-lock-open"></i> Acessar Portal';
                btn.disabled = false;
            } else {
                sessionStorage.setItem('clienteCnpj', data[0].cnpj);
                sessionStorage.setItem('clienteNome', data[0].razao_social);
                window.location.href = 'painel-cliente.html';
            }
        });

        // LÓGICA DE CADASTRO
        document.getElementById('formCadastro').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msg = document.getElementById('msgCadastro');
            const btn = document.querySelector('#formCadastro .btn-acao');
            
            const novoCliente = {
                razao_social: document.getElementById('cadRazao').value.trim(),
                cnpj: document.getElementById('cadCnpj').value.trim(),
                whatsapp: document.getElementById('cadWhatsapp').value.trim(),
                nome_contato: document.getElementById('cadNome').value.trim(),
                email: document.getElementById('cadEmail').value.trim(),
                chave_mestre: document.getElementById('cadSenha').value.trim()
            };

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processando...';

            // Insere no banco
            const { error } = await supabaseClient.from('clientes').insert([novoCliente]);

            if (error) {
                msg.style.display = 'block';
                msg.className = 'mensagem msg-erro';
                msg.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> CNPJ já cadastrado ou erro na rede.';
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-user-check"></i> Finalizar Cadastro';
            } else {
                msg.style.display = 'block';
                msg.className = 'mensagem msg-ok';
                msg.innerHTML = '<i class="fa-solid fa-circle-check"></i> Cadastro realizado! Faça login.';
                document.getElementById('formCadastro').reset();
                
                setTimeout(() => {
                    alternarAba('login');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-user-check"></i> Finalizar Cadastro';
                    msg.style.display = 'none';
                }, 2500);
            }
        });
    </script>
</body>
</html>

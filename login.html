<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Cliente | EngQuadros</title>
    <link rel="icon" type="image/png" href="public/favicon.png">
    
    <!-- Tipografia Corporativa -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/fundo.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/security.js"></script>

    <style>
        :root { 
            --azul-profundo: #060b14; 
            --azul-marca: #0b1c35; 
            --azul-sutil: #2b5c92; 
            --branco: #ffffff;
            --sucesso: #10b981;
            --erro: #ef4444;
            --transicao: all 0.3s ease;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: var(--azul-profundo); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; color: var(--branco); padding: 20px; 
            overflow: auto;
        }

        h1, h2, h3, button { font-family: 'Montserrat', sans-serif; }

        /* CONTAINER GLASSMORPHISM */
        .auth-container { 
            background: rgba(6, 11, 20, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 45px 40px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            border: 1px solid rgba(255, 255, 255, 0.1); border-top: 4px solid var(--azul-sutil); 
            width: 100%; max-width: 480px; position: relative; z-index: 10;
        }

        .logo { max-width: 160px; margin-bottom: 25px; display: block; margin-left: auto; margin-right: auto; }

        .titulo-acesso {
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }
        .aviso-acesso {
            text-align: center;
            font-size: 0.82rem;
            color: rgba(255,255,255,0.55);
            line-height: 1.45;
            margin-bottom: 24px;
        }

        .input-group { margin-bottom: 18px; text-align: left; }
        .input-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: rgba(255,255,255,0.7); font-weight: 500; }
        .input-group input { 
            width: 100%; padding: 12px 15px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15); 
            background: rgba(255,255,255,0.03); color: var(--branco); font-size: 0.95rem; transition: var(--transicao);
        }
        .input-group input:focus { outline: none; border-color: var(--azul-sutil); background: rgba(255,255,255,0.08); box-shadow: 0 0 0 3px rgba(43, 92, 146, 0.2); }

        .linha-dupla { display: flex; gap: 15px; }
        .linha-dupla .input-group { flex: 1; }

        .btn-acao { 
            width: 100%; padding: 14px; background: var(--azul-marca); color: var(--branco); 
            border: none; border-radius: 6px; font-size: 1rem; font-weight: 700; 
            cursor: pointer; transition: var(--transicao); margin-top: 15px; letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-acao:hover { background: var(--azul-sutil); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(43, 92, 146, 0.3); }

        .mensagem { font-size: 0.9rem; margin-top: 15px; display: none; text-align: center; font-weight: 600; padding: 10px; border-radius: 6px; }
        .msg-erro { background: rgba(239, 68, 68, 0.1); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.2); }
        .msg-ok { background: rgba(16, 185, 129, 0.1); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.2); }

        .voltar { display: block; margin-top: 30px; color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.9rem; transition: var(--transicao); text-align: center; font-weight: 500; }
        .voltar:hover { color: var(--branco); }

        .hp-field { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; opacity: 0; }
        .captcha-box { margin-top: 4px; margin-bottom: 6px; }
        .captcha-row { display: flex; align-items: stretch; gap: 10px; }
        .captcha-row canvas { flex: 1; height: 52px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15); background: #0a1628; }
        .captcha-refresh { width: 52px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.04); color: #fff; cursor: pointer; }
        .captcha-refresh:hover { background: rgba(43, 92, 146, 0.35); border-color: var(--azul-sutil); }
        .captcha-hint { font-size: 0.75rem; color: rgba(255,255,255,0.45); margin-top: 6px; }
    </style>
</head>
<body>

    <div class="global-bg"></div>
    <div class="circuit-overlay"></div>

    <div class="auth-container">
        <img src="public/logo.png" alt="EngQuadros" class="logo">
        <h1 class="titulo-acesso">Área do Cliente</h1>
        <p class="aviso-acesso">O cadastro é feito exclusivamente pela equipe. Use o CNPJ e a chave de acesso recebidos da empresa.</p>

        <!-- FORMULÁRIO DE LOGIN -->
        <form id="formLogin" autocomplete="off">
            <div class="hp-field" aria-hidden="true">
                <label for="websiteUrl">Não preencha</label>
                <input type="text" id="honeyPot" name="website" tabindex="-1" autocomplete="off">
            </div>
            
            <div class="input-group">
                <label>CNPJ da Empresa</label>
                <input type="text" id="loginCnpj" placeholder="Somente números" required autocomplete="off">
            </div>
            <div class="input-group">
                <label>Chave de Acesso (Senha)</label>
                <input type="password" id="loginSenha" required autocomplete="current-password">
            </div>
            <div class="input-group captcha-box">
                <label>Código de verificação</label>
                <div class="captcha-row">
                    <canvas id="captchaCanvas-login" width="280" height="52" aria-label="Código CAPTCHA"></canvas>
                    <button type="button" class="captcha-refresh" id="captchaRefresh-login" title="Gerar novo código" aria-label="Gerar novo código">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
                <input type="text" id="captchaInput-login" maxlength="8" placeholder="Digite o código da imagem" required autocomplete="off" style="margin-top:10px;" autocapitalize="characters">
                <p class="captcha-hint">Digite os caracteres da imagem. Clique na imagem para renovar.</p>
            </div>
            <div class="input-group" style="margin-top: 12px;">
                <button type="button" id="togglePassword" class="btn-acao" style="width: 100%; padding: 12px; background: transparent; border: 1px solid rgba(255,255,255,0.15); color: var(--branco); border-radius: 6px; font-size: 0.95rem; transition: var(--transicao); cursor: pointer; justify-content: center; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-eye"></i> Mostrar senha
                </button>
            </div>
            <button type="submit" class="btn-acao"><i class="fa-solid fa-lock-open"></i> Acessar Portal</button>
            <div id="msgErroLogin" class="mensagem msg-erro"><i class="fa-solid fa-triangle-exclamation"></i> Credenciais inválidas.</div>
        </form>

        <a href="index.html" class="voltar"><i class="fa-solid fa-arrow-left"></i> Voltar ao ERP</a>
    </div>

    <script src="js/security.js"></script>
    <script src="js/captcha.js"></script>
    <script>
        if (typeof window.supabase === 'undefined') {
            alert('⚠️ ERRO: O motor do banco de dados não carregou.');
        }

        const supabaseClient = EqSec.criarClienteSupabase();

        function mostrarErroLogin(texto) {
            const msgErro = document.getElementById('msgErroLogin');
            msgErro.style.display = 'block';
            msgErro.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> ' + texto;
        }

        async function autenticarCliente(cnpjInput, chaveInput) {
            const rpc = await supabaseClient.rpc('login_cliente', { p_cnpj: cnpjInput, p_chave: chaveInput });
            if (!rpc.error && rpc.data) return rpc.data;
            if (EqSec.rpcFalhouPorAusencia(rpc.error)) {
                const cnpjLimpo = cnpjInput.replace(/\D/g, '');
                let resultado = await supabaseClient.from('clientes')
                    .select('id, cnpj, razao_social, status, empresa_id')
                    .eq('cnpj', cnpjLimpo)
                    .eq('chave_mestre', chaveInput);
                if (!resultado.error && resultado.data && resultado.data.length) return resultado.data[0];
                resultado = await supabaseClient.from('clientes')
                    .select('id, cnpj, razao_social, status, empresa_id')
                    .eq('cnpj', cnpjInput)
                    .eq('chave_mestre', chaveInput);
                if (!resultado.error && resultado.data && resultado.data.length) return resultado.data[0];
            }
            return null;
        }

        document.addEventListener('DOMContentLoaded', function() {
            EngCaptcha.init('login');

            const cnpjInputs = document.querySelectorAll('input[id*="Cnpj"], input[id*="cnpj"]');
            cnpjInputs.forEach(input => {
                input.addEventListener('input', function(e) {
                    let value = e.target.value.replace(/\D/g, '');
                    value = value.replace(/^(\d{2})(\d)/, '$1.$2');
                    value = value.replace(/^(\d{2}\.\d{3})(\d)/, '$1.$2');
                    value = value.replace(/^(\d{2}\.\d{3}\.\d{3})(\d)/, '$1/$2');
                    value = value.replace(/^(\d{2}\.\d{3}\.\d{3}\/\d{4})(\d)/, '$1-$2');
                    e.target.value = value;
                });
            });

            const togglePassword = document.getElementById('togglePassword');
            if (togglePassword) {
                const passwordInput = document.getElementById('loginSenha');
                togglePassword.addEventListener('click', function() {
                    const visivel = passwordInput.type === 'password';
                    passwordInput.type = visivel ? 'text' : 'password';
                    const icon = this.querySelector('i');
                    if (icon) icon.className = visivel ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
                    this.lastChild.textContent = visivel ? ' Ocultar senha' : ' Mostrar senha';
                });
            }

            const params = new URLSearchParams(window.location.search);
            if (params.get('session') === 'expired') {
                mostrarErroLogin('Sessão expirada. Faça login novamente.');
            }
        });

        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();
            const cnpjInput = document.getElementById('loginCnpj').value.trim();
            const chaveInput = document.getElementById('loginSenha').value.trim();
            const msgErro = document.getElementById('msgErroLogin');
            const btn = document.querySelector('#formLogin button[type="submit"]');

            msgErro.style.display = 'none';

            const captcha = EngCaptcha.validar('login', '#honeyPot');
            if (!captcha.ok) {
                mostrarErroLogin(captcha.mensagem);
                return;
            }

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Autenticando...';
            btn.disabled = true;

            try {
                const cliente = await autenticarCliente(cnpjInput, chaveInput);

                if (!cliente || cliente.status === 'bloqueado' || cliente.status === 'inativo') {
                    EngCaptcha.registrarFalhaLogin('login');
                    EngCaptcha.regenerar('login');
                    mostrarErroLogin('Credenciais inválidas.');
                    btn.innerHTML = '<i class="fa-solid fa-lock-open"></i> Acessar Portal';
                    btn.disabled = false;
                    return;
                }

                EngCaptcha.zerarFalhas('login');
                sessionStorage.setItem('clienteCnpj', EqSec.cnpjDigitos(cliente.cnpj) || String(cliente.cnpj || '').trim());
                sessionStorage.setItem('clienteNome', cliente.razao_social);
                if (cliente.empresa_id) sessionStorage.setItem('empresaId', cliente.empresa_id);
                sessionStorage.removeItem('cnpj');
                localStorage.removeItem('clienteCnpj');
                localStorage.removeItem('cnpj');
                window.location.href = 'painel-cliente.html';
            } catch (err) {
                EngCaptcha.regenerar('login');
                mostrarErroLogin('Não foi possível autenticar. Tente novamente.');
                btn.innerHTML = '<i class="fa-solid fa-lock-open"></i> Acessar Portal';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
